  items:
    - id: duping-diantai-ep05
      type: video
      title: 【毒评电台】EP.05 堂堂复活！老二次元也能再用 AI 登上新时代的破船吗？
      episode: EP.05
      platform: Bilibili
      date: 2026-03-06T00:00:00.000Z
      duration: 1h 46m
      url: https://www.bilibili.com/video/BV1ykP4zVEno/
      embed: https://player.bilibili.com/player.html?isOutside=true&aid=116182271204728&bvid=BV1ykP4zVEno&cid=36501062071&p=1
      cover: https://i1.hdslb.com/bfs/archive/cd96e5a1fd70320afcd5c64d8a45e5c51df49fa6.jpg
      description: >-
        不得不感慨，在2023年诺子开启这个电台的时候，谁能想到仅仅就在不到三年后，他就真真又正正地用AI动画登上了新时代的破船了呢？以至于《毒评电台》这个系列也得到了重启，Crychic必须复活！真是可喜可贺、可喜可贺！

        可以说本期节目与《毒评电台》的关系相当于 ep.8 ぼっち・ざ・ろっく相对于《孤独摇滚》，ep.7 大場なな 相对于《少女歌剧》的关系，标题回点题的含金量这块！

        以及在最后谈到openclaw的创始人Peter的故事时，忘记说了一点是，当Peter这种再老派不过的程序员在退休后遇到遇到AI编程这个新的“玩具”，从而重新燃起了热情去创造了openclaw这样颠覆性的项目，也许对于动画行业来说，seedance以及后续演进的AI动画工具，也会成为某个引发奇迹的拐点也说不定呢？至少诺子的《兰斯10》动画，让我想要将大AI动画时代的可能性押注在这种信心之上!
      tags:
        - AI
        - 动画
    - id: chuncai-radio-yuri-strongest
      type: video
      title: 「蠢材呓事电台」史上最强百合vs现代最强百合
      episode: ""
      platform: Bilibili
      date: 2026-07-28T15:47:23.000Z
      duration: 1h 34m
      url: https://www.bilibili.com/video/BV1VQ3z6cEVh/
      embed: https://player.bilibili.com/player.html?isOutside=true&aid=116998365255671&bvid=BV1VQ3z6cEVh&cid=40384530804&p=1
      cover: https://i2.hdslb.com/bfs/archive/74ccd75c4ead97950eb0b4236ebfe82fe4d84b75.jpg
      description: >-
        《上伊那牡丹》就是《小马宝莉》新世代“Osake is Magic”的又一有力证明（×）不过确实录制到结尾都已经是转钟深夜了脑袋不是很清醒，已经说不出什么话来了真是抱歉！

        值得一提的是，本期节目从后期剪辑到最终成片，大约有80%的工作都是由AI完成的，包括但不限于音频处理、字幕生成、视频画面制作，甚至还专门做了打轴和人工校验的工具（就是烧光了我好几次codex的重置额度）

        不过也正是在后期制作的过程中，自己就像最喜欢的Rarity一样迎来了真正的灵感时刻：既然剪映的字幕识别能力这么强，那么字节有没有可能把这项能力开放成API呢？于是我跑到火山引擎里一通翻找，结果还真找到了一个既便宜又可靠的接口，比起那些号称对中文支持很好、实际用起来又贵、效果又糟糕的开源模型，不知道高到哪里去了（中国人能飞.jpg）

        如果不是完成了这次魔法般的跳跃，恐怕还不知道要和codex斗智斗勇多久说是，真是可喜可贺！
      tags:
        - 动画
        - 小马宝莉
        - 上伊那牡丹
