    - id: duping-diantai-ep04
      type: video
      title: 【毒评电台】EP.04 毕业季必看的2017遗珠！6年后再谈《Just Because!》
      episode: EP.04
      platform: Bilibili
      date: 2023-06-23T00:00:00.000Z
      duration: 1h 15m
      url: https://www.bilibili.com/video/BV1uV4y127Yz/
      embed: https://player.bilibili.com/player.html?isOutside=true&aid=870018873&bvid=BV1uV4y127Yz&cid=1172130503&p=1
      cover: https://i0.hdslb.com/bfs/archive/35be978e46e8e1bea5334e7956e4d7da71424871.jpg
      description: >-
        在当下，去谈论6年前的一部近乎未掀起风浪的动画，似乎总是需要某种理由的；可对此，我们所给出的理由，其实正如作品的标题所言：Just Because！虽以一句宣言或口号作为标题，但《Just
        Because!》实际上是一部专注于描绘话语缺席的动画；而在跨越了数年时光的所有既定的缄默的背后，我们依然祈盼所有沉默的声音都能被听到，于是这期节目便“仅仅因此”地诞生了——而在录制这期节目的途中，我或许也稍微找回了点宛若脚步声的心跳，或是那些难以言表的失去之物，也希望大家能够稍微有所共鸣吧。
      tags:
        - 动画
        - Just Because!
    - id: chuncai-radio-ikoku-nikki
      type: video
      title: 「蠢材呓事电台」所有人终于聚在同一国家聊的《异国日记》
      episode: ""
      platform: Bilibili
      date: 2026-06-11T00:00:00.000Z
      duration: 1h 45m
      url: https://www.bilibili.com/video/BV1GAEZ6wEt7/
      embed: https://player.bilibili.com/player.html?isOutside=true&aid=116726775683716&bvid=BV1GAEZ6wEt7&cid=39015679411&p=1
      cover: https://i2.hdslb.com/bfs/archive/3d0ad516bad59f2e60d2138d62d1e1b86847c284.jpg
      description: >-
        在这期节目中，我们不仅拥有1996年的《异国日记》，更拥有2026年的《悠长假期》，还有《火花》，“异星日记”《星际拓荒》，以及电台隐藏嘉宾《回转企鹅罐》。

        如果要我用一句最间接，最虚幻，最墨迹，最委婉，最拐弯抹角的话来形容《异国日记》，那么它就是我们这个时代青年人的某种「生存战略」——它让人想要唱歌，想要去呐喊，想要去哀悼，想要去开启一场冒险：或许是为了改变世界，又或许仅仅是为了让失落的朋友振作起来……无论如何，我们聚在一起录制了这期节目。
      tags:
