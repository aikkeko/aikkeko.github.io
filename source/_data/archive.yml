  author: AikeKo
homepage:
  featured_article: ""
articles:
  20170828_世界是我们最初和最后的爱:
    title: 世界始终是我们最初与最后的爱 ~ 关于《キラ☆キラ》的杂谈
    author: AikeKo
    description: "一群抱着乐器一路逃亡的笨蛋，把朋克、青春与毁灭唱成了留给世界的歌。《Kira☆Kira》的余响从未真正停下，因为那份不肯服输的爱，本身就是最响亮的反抗。"
    categories:
      - 游戏
    tags:
      - 游戏
  20181104_你离别的日子，定能将我改变:
    title: 你离别的日子，定能将我改变——评《离别的钢琴奏鸣曲》
    author: AikeKo
    description: "杉井光老师后来挖坑成瘾、无药可救，但《离别的钢琴奏鸣曲》依然值得说尽好话。真冬的钢琴、直巳的歌，还有那些哭过与离别的日子，终究会温柔地改变明天。"
    categories:
      - 书籍
    tags:
      - 书籍
  20181218_在没有神的世界中追寻:
    title: 在没有神的世界中追寻 | 《神的记事本①》单卷评析
    author: AikeKo
    description: "十六岁的冬天，鸣海遇见侦探、黑道、尼特族和一个藏在玩偶堆里的女孩。这不只是彩夏的故事，也是在没有神的世界里，孤独的人们笨拙地尝试相互拯救的故事。"
    categories:
      - 书籍
    tags:
      - 书籍
  20190129_没有惩罚，世界也没有被爱:
    title: 没有惩罚，世界也没有被爱 |《CARNIVAL》游戏/后传小说杂谈
    author: AikeKo
    description: "游戏结束七年后，世界没有变得更好，伤口也没有凭空消失。《CARNIVAL》真正残酷的地方或许正在于此：那些没有得到惩罚、也没有被爱的人，居然还会不可救药地爱着这个狗屎般的世界。"
    categories:
      - 游戏
    tags:
      - 游戏
      - 书籍
  20190223_朝向最后的舞台:
    title: 朝向那最后的舞台—— |《我的青春恋爱物语果然有问题》第十三卷吐槽
    author: AikeKo
    description: "整整一卷舞会，一群人继续把每句话说成谜语，然后由比滨又哭了——渡航你到底在干什么啊？可当侍奉部的门终于关上，这段漫长的青春也确实走到了最后一站。"
    categories:
      - 书籍
    tags:
      - 书籍
  20190327_如果还有明天……:
    title: 如果还有明天…… | 关于《Narcissu》的一切
    author: AikeKo
    description: "她没有等到奇迹，也没有被谁拯救，只是在冬天沿着七号公路一直向南。濑津美、地图、一号线与海边盛开的水仙，最终拼成一曲献给那段没有明天的旅程的挽歌。"
    categories:
      - 游戏
    tags:
      - 游戏
  20190804_没能“真心为你”的我们:
    title: 没能“真心为你”的我们 | 关于《EVA》× 卡夫卡的随笔
    author: AikeKo
    description: "真嗣站在空无一人的街道，K.站在通往城堡的木桥；他们都迷路了，而且大概永远无法抵达。当《EVA》与卡夫卡在此相遇，两个没有中心的世界或许能为“不属于这里”的人打开一扇窗。"
    categories:
      - 动画
    tags:
      - 动画
      - 书籍
  20190821_正因是谎言，一切才更加温柔:
    title: 正因是谎言，一切才更加温柔 | 三秋缒《君の话》扫雷+简评
    author: AikeKo
    description: "两部作品路转粉，三部作品粉转黑——三秋缒似乎只会把同一种苦涩青春反复端上来，直到《你的故事》用一个温柔的谎言完成反击。至少这一次，世界仍然有爱。"
    categories:
      - 书籍
    tags:
      - 书籍
  20200410_青春、死亡，以及时间的重量:
    title: 青春、死亡，以及时间的重量 |《Cross Game》、安达充，还有我的ACG
    author: AikeKo
    description: "若叶已经离开很久了，但她仍藏在生日礼物、甲子园的约定和青叶不坦率的眼神里。安达充让死亡拥有时间的重量，又让活着的人背负这份重量，继续走向那片四叶草般的幸福。"
    categories:
      - 动画
    tags:
      - 动画
  20210514_新加坡的天空:
    title: 新加坡的天空 | 随笔（1）
    author: AikeKo
    description: "新加坡的天空很低，低到云、雷声和战斗机仿佛都触手可及。疫情中的航班追着日出越过时区，有些天空属于异乡，有些声音属于回忆，而它们最终共享着同一片没有国界的蓝色。"
    categories:
      - 生活
    tags:
      - 生活
  20241003_西历2236年的恋人絮语:
    title: 西历2236年的恋人絮语 | With love from 2018 A.D.
    author: AikeKo
    description: "2018年，一首《SOLVED9》让尚且读不懂的《西历2236》提前成为幽灵；六年后，它终于沿着旧日信号归来。三万字仍不足以证明什么，只留下笨拙、反复、自作多情，却发自真心的恋人絮语。"
    categories:
      - 游戏
    tags:
      - 游戏
  20260128_你可以回到Vorkuta，但那已经没有人了:
    title: 你可以回到Vorkuta-5，但那里已经没有人了 | 一个理解《Z.A.T.O》的视角
    author: AikeKo
    description: "你可以回到Vorkuta-5，但那里已经没有人了。紫红色天空、泄露的梦核与苏联废墟通向一个早已消失的童年世界；怀旧从来不能带人回去，它只是让过去化作信号，再一次穿过此刻。"
    categories:
      - 游戏
    tags:
      - 游戏
  20200210_坦率的、沉默的...:
    title: 坦率的、沉默的...|关于《春物14》，或者更多
    author: AikeKo
    description: "渡航获得了提前送达的原谅，《春物14》也终于走到结尾。党争结束，真物有了答案，但最后留下的只是一场告别：送那些不肯坦率的少年少女，走出这段持续多年的青春。"
    categories:
      - 书籍
    tags:
      - 书籍
  20200406_命运的果实:
    title: 命运的果实 | 《白痴》杂谈
    author: AikeKo
    description: "梅诗金如此纯洁、诚实而充满怜悯，最后却谁也没能拯救，甚至连自己也再度变成了“白痴”。陀思妥耶夫斯基偏要在最残酷的结局里发问：即便神圣被碾碎、爱看似毫无用处，信仰仍能成立吗？"
    categories:
      - 书籍
    tags:
      - 书籍
  20200516_祈祷的意义:
    title: 祈祷的意义
    author: AikeKo
    description: "《卡拉马佐夫兄弟》留下了一束照进心灵的光。祈祷未必需要上帝：它也可以只是愿意承担世界给予的一切，在无法全善的抉择中，仍小心翼翼地希望事情走向更好的地方。"
    categories:
      - 书籍
    tags:
      - 书籍
  20200622_仅有感觉的世界:
    title: 仅有感觉的世界 | 《喧哗与骚动》一个休谟式的解读
    author: AikeKo
    description: "“一个人是他不幸的总和。”借着萨特与休谟绕一点远路，《喧哗与骚动》的绝望或许正在于此：那里的人只有感觉和过去，没有任何东西来自未来，时间像鬼影一样把每个人困在自身之中。"
    categories:
      - 书籍
    tags:
      - 书籍
  20200715_被拉远的距离:
    title: 被拉远的距离 | 《死屋手记》杂谈
    author: AikeKo
    description: "这本最接近陀思妥耶夫斯基真实苦役经历的小说，反而用层层转述把作者推得很远。沿着这段奇怪的距离走进西伯利亚的“死屋”，仍能找到一束尚且微弱、却将照亮其余生作品的信仰之光。"
    categories:
      - 书籍
    tags:
      - 书籍
  20200820_我们终于如愿以偿成为臭虫:
    title: 我们终于如愿以偿成为臭虫 | 《地下室手记》杂谈
    author: AikeKo
    description: "卡夫卡让人一觉醒来变成甲虫，陀思妥耶夫斯基却写出了人如何心甘情愿成为臭虫。更糟的是，地下室人的自怜、恶意与无意义呻吟并未留在十九世纪——稍微照照镜子，里面或许就是熟悉的面孔。"
    categories:
      - 书籍
    tags:
      - 书籍
  20201228_朝向更远的地方:
    title: 朝向更远的地方 | 2020年阅读总结
    author: AikeKo
    description: "2020年读完110本书，比上一年少了四十本，姑且也算完成任务（毕竟收了就是收了×）。这既是年度书单，也是一份关于疲惫、信仰和继续前进的记录：现实无法抵达之处，自有书籍带路。"
    categories:
      - 书籍
    tags:
      - 书籍
  20250326_荒原即是战场:
    title: 荒原即是战场 | 简单review下《死亡搁浅》
    author: AikeKo
    description: "背起货物，从A走到B；跌倒、修路、拍照，再把陌生人的世界连接起来。《死亡搁浅》最动人的地方可能正是这份笨拙：穿越荒原的一千公里之后，送达本身就是它所许诺的浪漫。"
    categories:
      - 游戏
    tags:
      - 游戏
